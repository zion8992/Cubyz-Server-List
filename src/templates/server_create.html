{{define "content" }}
<form method="POST" action="/servers/create">
	<input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
	<h2>Create Server</h2>

	<label for="name">Server Name*</label>
	<input type="text" id="name" name="name" required maxlength="52" placeholder="My Server (Snails Only!)">
		
	<label for="ip">Server IP*</label>
	<input type="text" id="ip" name="ip" required maxlength="52" placeholder="snails.gg">

	<label for="description">Description</label>
	<textarea id="description" name="description" placeholder="The Great Place of Snails"></textarea>


	<button type="submit">Create Server</button>
</form>
{{end}}
