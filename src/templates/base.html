<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubyz Server List</title>
    <link rel="stylesheet" href="/static/base.css">
    <link rel="stylesheet" href="/static/dark.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="icon" href="/static/img/ironite.ico">
</head>
<body>
    <header>
        <div class="name">
            <a href="/" style="text-decoration: none;"><h1 class="special-font">{{ .AppName }}</h1></a>
        </div>
        <nav>
            <a href="/servers/create" class="button secondary">Create Server</a>
            <a href="/list" class="nav-btn">List</a>
            {{ if .IsLoggedIn }}
            <a href="/account" class="nav-btn"><b>Account</b></a>
            {{ else }}
            <a href="/login" class="nav-btn">Log in</a>
            <a href="/register" class="nav-btn"><b>Register</b></a>
            {{ end }}
            <a href="/info" class="nav-btn">Info</a>
            <a href="/theme" class="nav-btn">Toggle Theme</a>
        </nav>
    </header>
    
    <main>
        {{ template "content" . }}
    </main>

    <footer>
        <p>&copy; 2026 zion8992. Powered by <a href="https://github.com/zion8992/ironite">Ironite</a></p>
    </footer>
</body>
<script>
    (function () {
    // Helper to read a cookie value by name
    function getCookie(name) {
        const match = document.cookie.match(
            new RegExp('(?:^|;\\s*)' + name + '=([^;]*)')
        );
        return match ? decodeURIComponent(match[1]) : null;
    }

    // Decide which stylesheet to use
    const isLightMode = getCookie('light-mode') === 'true';
    const themeHref = isLightMode ? '/static/light.css' : '/static/dark.css';

    // Inject the stylesheet link into <head>
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = themeHref;
    link.id = 'theme-stylesheet';
    document.head.appendChild(link);
})();
</script>
</html>
