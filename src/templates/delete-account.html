{{ define "content" }}

<h2>You are about to delete your account.</h2>
<h2>This action cannot be undone.</h2>
<h3>Your account will be sent to the deleted accounts world forever (a very very very VERY long time!).</h3>

<form method="POST" action="/account-delete-forever-and-ever">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <button type="submit" class="button danger" style="border:none;">DELETE PERMANENTLY</button>
</form>

{{ end }}
