{{ define "content" }}

<div class="servers_list">
    <div class="filters">
        <h2>Filters</h2>
        <form method="GET" action="/list">
            <p>
                <label>Search</label>
                <input type="search" name="search" placeholder="Search servers..." value="{{.Filter.Search}}">
            </p>

            <p>
                <label>Version</label>
                <select name="version">
                    <option value="Any" {{if eq .Filter.Version "Any"}}selected{{end}}>Any</option>
                    <option value="0.0.0" {{if eq .Filter.Version "0.0.0"}}selected{{end}}>0.0.0</option>
                    <option value="0.0.1" {{if eq .Filter.Version "0.0.1"}}selected{{end}}>0.0.1</option>
                    <option value="0.1.0" {{if eq .Filter.Version "0.1.0"}}selected{{end}}>0.1.0</option>
                    <option value="0.1.1" {{if eq .Filter.Version "0.1.1"}}selected{{end}}>0.1.1</option>
                    <option value="0.2.0" {{if eq .Filter.Version "0.2.0"}}selected{{end}}>0.2.0</option>
                    <option value="0.3.0" {{if eq .Filter.Version "0.3.0"}}selected{{end}}>0.3.0 (Latest)</option>   
                </select>
            </p>

            <p>
                <label>Players</label>
                <input type="number" name="min_players" placeholder="Min" min="0" value="{{.Filter.MinPlayers}}">
                <input type="number" name="max_players" placeholder="Max" min="0" value="{{.Filter.MaxPlayers}}">
            </p>

            <p>
                <label>Gamemode</label>
                <div>
                    <label><input type="checkbox" name="gamemode" value="Survival" {{if index .GamemodeChecks "Survival"}}checked{{end}}> Survival</label><br>
                    <label><input type="checkbox" name="gamemode" value="Creative" {{if index .GamemodeChecks "Creative"}}checked{{end}}> Creative</label><br>
                    <label><input type="checkbox" name="gamemode" value="PvP" {{if index .GamemodeChecks "PvP"}}checked{{end}}> PvP</label>
                </div>
            </p>

            <p>
                <label>Languages</label>
                <div>
                    <label><input type="checkbox" name="language" value="English" {{if index .LanguageChecks "English"}}checked{{end}}> English</label><br>
                    <label><input type="checkbox" name="language" value="Spanish" {{if index .LanguageChecks "Spanish"}}checked{{end}}> Spanish</label><br>
                    <label><input type="checkbox" name="language" value="French" {{if index .LanguageChecks "French"}}checked{{end}}> French</label><br>
                    <label><input type="checkbox" name="language" value="German" {{if index .LanguageChecks "German"}}checked{{end}}> German</label><br>
                    <label><input type="checkbox" name="language" value="Portuguese" {{if index .LanguageChecks "Portuguese"}}checked{{end}}> Portuguese</label><br>
                    <label><input type="checkbox" name="language" value="Russian" {{if index .LanguageChecks "Russian"}}checked{{end}}> Russian</label><br>
                    <label><input type="checkbox" name="language" value="Chinese" {{if index .LanguageChecks "Chinese"}}checked{{end}}> Chinese</label><br>
                    <label><input type="checkbox" name="language" value="Japanese" {{if index .LanguageChecks "Japanese"}}checked{{end}}> Japanese</label>
                </div>
            </p>

            <p>
                <label>Requires Mods</label>
                <input type="checkbox" name="requires_mods" {{if .Filter.RequiresMods}}checked{{end}}>
            </p>

            <p>
                <label>Sort</label>
                <select name="sort">
                    <option value="players" {{if eq .Filter.Sort "players"}}selected{{end}}>Most Players</option>
                    <option value="newest" {{if eq .Filter.Sort "newest"}}selected{{end}}>Newest</option>
                    <option value="name" {{if eq .Filter.Sort "name"}}selected{{end}}>Name</option>
                </select>
            </p>
            <p>
                <label>Status</label>
                <select name="status">
                    <option value="all" {{if eq .Filter.Status "all"}}selected{{end}}>All</option>
                    <option value="online" {{if eq .Filter.Status "online"}}selected{{end}}>Online</option>
                    <option value="offline" {{if eq .Filter.Status "offline"}}selected{{end}}>Offline</option>
                </select>
            </p>


            <p>
                <button type="submit">Apply Filters</button>
                <a href="/list"><button type="button">Reset</button></a>
            </p>
        </form>
    </div>

    <div class="servers">
        {{range .Servers}}
        <div class="server">
            {{ if .IconURL }}
            <img src="{{ .IconURL }}" alt="Server logo (Uncontrolled by the server list)" class="server-logo">
            {{ else }}
            <img src="/static/img/default_server.svg" alt="Default Server logo" class="server-logo">
            {{ end }}
            <div class="info">
                <h2>{{.Name}}</h2>
                <p class="playerCount">{{.PlayerCount}} Players Online</p>
                <p class="playerCount">{{ if .Status }}Online{{else}}Offline{{end}}</p>
                <a href="/servers/{{.ID}}" class="button">View Server</a>
            </div>
        </div>
        {{else}}
        <p>No servers match your filters.</p>
        {{end}}
    </div>
</div>

{{ end }}
