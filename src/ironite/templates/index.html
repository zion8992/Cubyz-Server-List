{{define "title"}}List{{end}} 
{{define "body"}}
<div class="filter-bar">
    <select id="search-field">
        <option value="name" selected>Name</option>
        <option value="ip">IP</option>
        <option value="version">Version</option>
    </select>
    <input type="text" name="search" placeholder="Ashframe" aria-label="Search servers" />

    <input type="date" id="date-filter" />
</div>
<p id="no-results" style="display: none">No servers found.</p>
<table>
    <tr>
        <th>Name</th>
        <th>IP</th>
        <th>Added</th>
        <th>Version</th>
        <th>Tags</th>
        <th>Description</th>
    </tr>
    {{range .List.Servers}}
    <tr>
        <td><a href="servers/">{{.Name}}</a></td>
        <td>{{.IP}}</td>
        <td>{{.DateCreated}}</td>
        <td>{{.Version}}</td>
        <td>{{.Tags}}</td>
        <td>{{.Description}}</td>
    </tr>
    {{end}}
</table>
<script>
    const searchInput = document.querySelector('input[name="search"]');
    const searchField = document.getElementById('search-field');
    const dateFilter  = document.getElementById('date-filter');
    const table       = document.querySelector('table');
    const noResults   = document.getElementById('no-results');

    if (searchInput && searchField && dateFilter && table && noResults) {
        // Column indexes: 0 = Name, 1 = IP, 2 = Added, 3 = Version,
        //                 4 = Gamemodes, 5 = Description
        const COLUMNS = { name: 0, ip: 1, added: 2, version: 3, gamemodes: 4, description: 5 };
        const DATE_COLUMN = 2;

        const MONTHS = {
            jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6,
            jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12
        };

        // Turns the server-rendered "Jan 15, 2024" into "2024-01-15".
        // Returns '' if the cell doesn't seem to have a date at all.
        function rowDateString(row) {
            const cell = row.cells[DATE_COLUMN];
            if (!cell) return '';
            const raw = cell.textContent.trim();

            // Don't convert the date if it is ISO formatted for some reason
            const iso = raw.match(/^(\d{4}-\d{2}-\d{2})/);
            if (iso) return iso[1];

            const m = raw.match(/^([A-Za-z]+)\.?\s+(\d{1,2}),\s*(\d{4})/);
            if (!m) return '';

            const month = MONTHS[m[1].slice(0, 3).toLowerCase()];
            if (!month) return '';

            return m[3] + '-' +
                   String(month).padStart(2, '0') + '-' +
                   m[2].padStart(2, '0');
        }

        function applyFilters() {
            const query        = searchInput.value.trim().toLowerCase();
            const column = COLUMNS[searchField.value];
            const selectedDate = dateFilter.value; // "YYYY-MM-DD" or ""
            const rows         = table.querySelectorAll('tr');

            let visibleCount = 0;

            rows.forEach(row => {
                if (row.querySelector('th')) return; // skip header

                const cell = row.cells[column];
                const textMatch = cell
                    ? cell.textContent.toLowerCase().includes(query)
                    : false;

                const dateMatch = !selectedDate ||
                                  rowDateString(row) === selectedDate;

                const match = textMatch && dateMatch;
                row.style.display = match ? '' : 'none';
                if (match) visibleCount++;
            });

            noResults.style.display = visibleCount ? 'none' : '';
        }

        searchInput.addEventListener('input', applyFilters);
        searchField.addEventListener('change', applyFilters);
        dateFilter.addEventListener('change', applyFilters);

        applyFilters(); // correct initial state
    }
</script>


{{end}}
