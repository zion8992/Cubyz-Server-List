{{define "title"}}List - Server List{{end}}
{{define "body"}}
<table>
   <tr>
      <th>Name</th>
      <th>IP</th>
      <th>Playercount</th>
      <th>Version</th>
      <th>Created</th>
   </tr>
   {{range .Servers}}
   <tr>
      <td><a href="/servers/{{.Slug}}.html">{{.Name}}</a></td>
      <td>{{.IP}}</td>
      <td>Playercount</td>
      <td>Version</td>
      <td>{{.DateCreated}}</td>
   </tr>
   {{end}}
</table>
{{end}}
