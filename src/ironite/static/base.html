<!DOCTYPE html>
<html>
<head>
    <title>{{block "title" .}}Untitled - Server List{{end}}</title>
    <style>{{.Style}}</style>
</head>
<body>
    <nav>
        <ul>   
            <li><h2>Server List</h2></li>
            <li><a href="/">List</a></li>
        </ul>
    </nav>

    <main>
    <h2>Server List</h2>
    <hr>
    {{block "body" .}}{{end}}
    </main>

    <footer>Generated by Ironite. Last Updated: {{.GenerationDate}}</footer>
</body>
<script>
    document.querySelectorAll('.copy-btn').forEach(button => {
    	button.addEventListener('click', async () => {
    		const ip = button.dataset.ip; // reads the data-ip attribute

    		try {
    			await navigator.clipboard.writeText(ip);

    			// Optional: give visual feedback
    			const originalText = button.textContent;
    			button.textContent = 'Copied!';
    			setTimeout(() => (button.textContent = originalText), 1500);
    		} catch (err) {
    			console.error('Failed to copy:', err);
    		}
    	});
    });
</script>
</html>
