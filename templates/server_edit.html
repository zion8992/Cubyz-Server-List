{{ define "content" }}
<div class="server-info-page">
	<form method="POST" action="/servers/edit/{{ .Server.ID }}">
		<header class="server-header">
			<img src="/static/img/default_server.png" alt="Server logo" class="server-logo">
			<input type="text" name="name" value="{{ .Server.Name }}" required maxlength="255" class="server-title-input">
			<div class="server-header-actions">
				<button type="submit" class="button">Save</button>
				<a href="/servers/{{ .Server.ID }}" class="button">Cancel</a>
			</div>
		</header>

		<div class="server-body">
			<section class="server-main">
				<nav class="server-tabs">
					<button type="button" class="server-tab active" data-tab="description">Description</button>
					<button type="button" class="server-tab" data-tab="xmlfeed">XML Feed</button>
				</nav>

				<div class="tab-panel active" id="tab-description">
					<textarea name="description" placeholder="Server description...">{{ .Server.Description }}</textarea>
				</div>

				<div class="tab-panel" id="tab-xmlfeed">
					<input type="url" name="xml_feed_link" value="{{ .Server.XMLFeedLink }}" placeholder="https://example.com/feed.xml">
				</div>
			</section>

			<aside class="server-sidebar">
				<h3>Details</h3>
				<ul>
					<li>
						<strong>IP:</strong>
						<input type="text" name="ip" value="{{ .Server.IP }}" required maxlength="255">
					</li>
					<li>
						<strong>Version:</strong>
						<input type="text" name="version" value="{{ .Server.Version }}" maxlength="255">
					</li>
					<li>
						<strong>Gamemodes:</strong>
						<input type="text" name="gamemodes" value="{{ .Server.Gamemodes }}" maxlength="255">
					</li>
					<li>
						<strong>Languages:</strong>
						<input type="text" name="languages" value="{{ .Server.Languages }}" maxlength="255">
					</li>
					<li>
						<strong>Mods required:</strong>
						<input type="checkbox" name="requires_mods" {{ if .Server.RequiresMods }}checked{{ end }}>
					</li>
					<li>
						<strong>Website:</strong>
						<input type="url" name="website_url" value="{{ .Server.WebsiteURL }}" placeholder="https://example.com">
					</li>
					<li>
						<strong>Chat:</strong>
						<input type="url" name="chat_url" value="{{ .Server.ChatURL }}" placeholder="https://discord.gg/...">
					</li>
				</ul>
			</aside>
		</div>
	</form>
</div>

<script src="/static/js/server_tabs.js"></script>
{{ end }}
