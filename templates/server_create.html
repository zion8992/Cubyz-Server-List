{{define "content" }}
<form method="POST" action="/servers/create">
	<h2>Create Server</h2>

	<label for="name">Server Name</label>
	<input type="text" id="name" name="name" required maxlength="255" placeholder="My Server (Snails Only!)">

	<label for="description">Description</label>
	<textarea id="description" name="description" placeholder="The Great Place of Snails"></textarea>
		
	<label for="ip">Server IP</label>
	<input type="text" id="ip" name="ip" required maxlength="60" placeholder="snails.gg">


	<button type="submit">Create Server</button>
</form>
{{end}}
